</head>

        <header>
            <h1>
                Feedback Form

        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>

                <li>
                    <a href="profile.html">Profile</a>

        </nav>    
        <main>
        <h2>Share Your Feedback</h2>
        <p>Please fill in the form below to share your thoughts about the courses
            and the portal.
        </p>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
            placeholder="Enter your  name..">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
            placeholder="enter your email">
            <br><br>
            <label for="phone">Phone No.</label>
            <input type="number" id="phone" name="phone"
            placeholder="Enter your Phone No.">
            <br><br>
            <h2><strong>Gender</strong></h2>
            <label>
                <input type="checkbox" name="like"  value="Female">
                Female
            </label>
            <label>
                <input type="checkbox" name="like"  value="Male">
               Male
            </label>
            <label>
                <input type="checkbox" name="like" value="Other">
                Other
            </label>
            <br><br>
            <label for="course">Choose a course:</label>
            <br>
            <select id="course" name="course">
                <option value="html">HTML and Web Fundamentals</option>
                <option value="python">Python</option>
                <option value="dbms">DBMS</option>
            </select>
            <br><br>
            <label for="message">Your Feedback:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea>
            <br><br>
            <label for="Rate the Portal">Rate the portal</label>
            <br>
            <select id="Rate" name="portal">
                <option value="excellent">excellent</option>
                <option value="very good">very good</option>
                <option value="Good">Good</option>
            </select>
            <br><br>
            <label>
                <input type="checkbox" name="like"  value="Subscribe to Newshelter and Updates">
           Subscribe to Newshelter and Updates
            </label>
            <br><br>
            <button type="submit">Submit Feedback</button>
            <button type="Reset">Reset</button>
        </form>
        </main>
        <hr>

        </footer>
    </body>
</html>
